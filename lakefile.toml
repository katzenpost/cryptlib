name = "cryptlib"
version = "0.2.0"
description = "Lean cryptography library for prototyping/modeling protocols and proving protocol properties."
keywords = ["cryptography", "post-quantum", "verification", "sphinx", "mixnet"]
homepage = "https://cryptlib.io"
license = "AGPL-3.0-only"
defaultTargets = ["Cryptlib"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "VCVio"
git = "https://github.com/dtumad/VCV-io.git"
rev = "v4.35.0"

[[require]]
name = "cborg"
git = "https://github.com/katzenpost/cborg.git"
rev = "v0.2.0"

# Declared last: VCVio pins mathlib v4.35.0, so this direct requirement (matching that pin)
# must come after VCVio's for Lake's reverse-declaration-order precedence to keep it authoritative.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Cryptlib"

[[lean_exe]]
name = "Cryptlib.Data.test"

[[lean_exe]]
name = "Cryptlib.Primitives.NIKE.test"

[[lean_exe]]
name = "Cryptlib.Primitives.NIKE.field25519_test"

